# macOS arm64 only (invariant 8): an app folder and a disk image, ad-hoc signed for local use (ADR-0039).
appId: io.github.3mukon.3mukon-code
files:
  - out/**
  - '!out/native/**'
  # node-pty's prebuilt modules for other systems, which the app never loads.
  - '!**/node_modules/node-pty/prebuilds/!(darwin-arm64)/**'
  # The Claude Code binaries the Claude Agent SDK's packages for each platform bring: the app runs the
  # user's CLI or its own downloaded copy, and carries no provider's binary (ADR-0039). The Codex and
  # Grok Build packages are development dependencies, which the app leaves out anyway.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
# What the app runs as programs, which macOS cannot run from inside the app's archive: node-pty's module
# and spawn helper (ADR-0015). The signing below signs them too.
asarUnpack:
  - '**/node_modules/node-pty/prebuilds/darwin-arm64/**'
npmRebuild: false
afterPack: scripts/stage-native-helper.mjs
mac:
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  # The app's icon, which scripts/app-icon.sh makes from a picture.
  icon: resources/icon.icns
  identity: '-'
  # The optional computer-use helper keeps its independent signature and designated requirement.
  signIgnore:
    - '/Contents/Helpers/Computer Use Helper\.app(/|$)'
  # Hardened runtime would make library validation reject the ad-hoc signed Electron framework; it
  # only matters for notarization, which a local build skips.
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
