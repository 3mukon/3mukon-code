# macOS arm64 only (invariant 8): an app folder and a disk image, ad-hoc signed for local use (ADR-0004).
appId: io.github.3mukon.3mukon-code
files:
  - out/**
  - '!out/native/**'
  # node-pty's prebuilt modules for other systems, which the app never loads.
  - '!**/node_modules/node-pty/prebuilds/!(darwin-arm64)/**'
# What the app runs as programs, which macOS cannot run from inside the app's archive: the Claude Code
# and Codex binaries of the pinned provider packages, with the tools beside Codex's, and node-pty's
# module and spawn helper (ADR-0015). Grok Build's binary stays inside, compressed, since its adapter
# unpacks it into the app's data. The signing below signs the unpacked binaries too.
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**'
  - '**/node_modules/@openai/codex-darwin-arm64/vendor/**'
  - '**/node_modules/node-pty/prebuilds/darwin-arm64/**'
npmRebuild: false
afterPack: scripts/stage-native-helper.mjs
mac:
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  # The app's icon, which scripts/app-icon.sh makes from a picture.
  icon: resources/icon.icns
  identity: '-'
  # The optional computer-use helper keeps its independent signature and designated requirement.
  signIgnore:
    - '/Contents/Helpers/Computer Use Helper\.app(/|$)'
  # Hardened runtime would make library validation reject the ad-hoc signed Electron framework; it
  # only matters for notarization, which a local build skips.
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
